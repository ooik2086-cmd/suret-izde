name: deploy

# master-ке push болған сайын Render-ді автоматты түрде жаңартады.
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          echo "Triggering Render deploy..."
          curl -s -o /dev/null -w "Deploy hook: HTTP %{http_code}\n" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
