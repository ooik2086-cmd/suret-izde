name: keep-alive

# Сайтты әр ~10 минут сайын "оятып" тұрады, Render тегін жоспарда ұйықтамас үшін.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:   # қолмен де іске қосуға болады

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the bot (so it never sleeps)
        run: |
          echo "Pinging bot..."
          curl -s -o /dev/null -w "bot HTTP %{http_code}\n" --max-time 60 https://suret-izde-1.onrender.com/ || true
      - name: Ping the web app
        run: |
          echo "Pinging suret-izde..."
          curl -s -o /dev/null -w "site HTTP %{http_code}\n" --max-time 60 https://suret-izde.onrender.com/ || true
