name: Build AutoClicker APK

on:
  push:
    branches:
      - "claude/screen-cutoff-fix-EHz2S"
    paths:
      - "autoclicker/**"
      - ".github/workflows/build-autoclicker.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: autoclicker
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp autoclicker/app/build/outputs/apk/debug/app-debug.apk autoclicker-app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoclicker-apk
          path: autoclicker-app.apk

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autoclicker-latest
          name: Авто Кликер — APK
          body: "Авто Кликер қосымшасы (рекламасыз). Телефонға жүктеп орнатыңыз."
          files: autoclicker-app.apk
